<!doctype html>
<html lang="zh-CN" data-variant="spatial">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DemoShot · 立体影像工作室</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./spatial.css">
  <script src="./app.js" defer></script>
  <script src="./spatial.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <section class="spatial-stage" aria-label="装饰插画：原创微缩产品视频工作室，非产品画面或分析结果">
    <canvas id="spatial-canvas" role="img" aria-label="动态三维微缩摄影棚，包含摄影机、布景台、灯光和分镜卡；仅为装饰"></canvas>
    <div class="spatial-stage-footer"><span id="spatial-status" role="status" hidden></span><button type="button" id="spatial-motion" aria-pressed="false">暂停动态</button></div>
  </section>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="connection">
    <button class="icon-button close-dialog" data-action="close-dialog" aria-label="关闭">×</button>
    <h2>连接 Agent</h2>
    <p>当前为 UI 原型，暂不支持登录、连接或发送消息。</p>
    <div class="connection-option"><strong>VS Code / Copilot</strong><span class="pill lavender">计划接入</span></div>
    <div class="connection-option"><strong>其他 MCP 客户端</strong><span class="pill">计划接入</span></div>
    <p class="muted small">示例模式不会调用模型、上传资料或产生费用。</p>
    <button class="primary" data-action="close-dialog">返回</button>
  </dialog>
</body>
</html>
